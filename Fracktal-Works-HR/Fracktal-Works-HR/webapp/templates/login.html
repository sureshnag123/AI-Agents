<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sign in — {{ company.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            {% if company.logo_path %}
            <img src="{{ url_for('static', filename=company.logo_path) }}" alt="logo">
            {% endif %}
            <h1>{{ company.name }}<br>HR Payroll Portal</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post">
                <div class="form-row" style="text-align:left;">
                    <label>Username</label>
                    <input type="text" name="username" required autofocus>
                </div>
                <div class="form-row" style="text-align:left;">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button class="btn" type="submit" style="width:100%;">Sign in</button>
            </form>
            <p style="margin-top:14px;"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
        </div>
    </div>
</body>
</html>
