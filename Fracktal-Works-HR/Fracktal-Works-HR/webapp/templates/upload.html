{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Upload Monthly Payroll</h2>
    <p class="text-muted">
        Upload the payroll Excel workbook (must contain a "Salary Sheet_&lt;Month&gt; &lt;Year&gt;" tab and an
        "Employee_Details" tab). Payslips and PF/ESI/PT totals are computed automatically from it.
    </p>
    <form method="post" enctype="multipart/form-data">
        <div class="form-row">
            <label>Payroll Excel file</label>
            <input type="file" name="payroll_file" accept=".xlsx" required>
        </div>
        <div class="form-row">
            <label>Salary sheet name (optional — auto-detected if left blank)</label>
            <input type="text" name="salary_sheet" placeholder="e.g. Salary Sheet_June 2026">
        </div>
        <button class="btn" type="submit">Process Payroll</button>
    </form>
</div>
{% endblock %}
