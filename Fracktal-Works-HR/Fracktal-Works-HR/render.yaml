# Render Blueprint for the Fracktal Works HR web app.
# You can either let Render read this file automatically ("New + > Blueprint"),
# or ignore it and fill the same values in by hand under "New + > Web Service" —
# both are covered in the deployment instructions.
services:
  - type: web
    name: fracktal-works-hr
    runtime: python
    plan: free
    rootDir: Fracktal-Works-HR/Fracktal-Works-HR
    buildCommand: pip install -r requirements.txt
    startCommand: cd webapp && waitress-serve --host=0.0.0.0 --port=$PORT app:app
    envVars:
      - key: SECRET_KEY
        sync: false          # set this by hand in the Render dashboard — never commit it
      - key: INITIAL_ADMIN_USER
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
    # Free tier has no persistent disk — the SQLite database resets on every
    # redeploy. Use the "Download database backup" button in Settings before
    # any planned update. A paid persistent disk (~$1/GB/month) removes this
    # limit if you ever want it — not enabled here since it costs money.
